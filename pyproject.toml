[build-system]
# scikit-build-core builds the optional C++ module scattuccino._core (D1). Without a compiler:
# pip install . -C cmake.define.SCATTUCCINO_BUILD_CORE=OFF (pure Python reference).
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "scattuccino"
version = "0.0.1"
description = "Light transport in tissue and tissue phantoms for biomedical optics"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.24"
build-dir = "build/py-{wheel_tag}"
wheel.packages = ["src/scattuccino"]

[tool.scikit-build.cmake.define]
SCATTUCCINO_BUILD_CORE = "ON"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = ["slow: expensive reference computation (pytest -m slow)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "bwpm", "bwpm.*", "rtt_fusion", "rtt_fusion.*"]
ignore_missing_imports = true
